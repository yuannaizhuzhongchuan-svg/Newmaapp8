<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8f6">
<title>予定ノート</title>
<style>
:root{--bg:#f4f8f6;--paper:#fff;--ink:#263d3a;--muted:#70827f;--line:#e1eae6;--accent:#527e76;--soft:#e8f1ee;--red:#c76b6b;--blue:#6386ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{max-width:1100px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px}.brand h1{font-size:21px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:0}.actions,.tools{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--accent);color:white;font-weight:650}.btn.secondary{background:var(--soft);color:var(--ink)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--accent)}.btn.danger{background:#fff0ef;color:#a34d4d}.btn.small{padding:6px 9px;font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:16px}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.monthhead,.sect{display:flex;justify-content:space-between;align-items:center;gap:8px}.monthhead h2,.sect h2{margin:0;font-size:18px}.monthnav{display:flex;gap:6px}.iconbtn{width:35px;height:35px;border:0;border-radius:9px;background:var(--soft);color:var(--accent);font-size:20px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.week{margin-top:12px}.week div{text-align:center;color:var(--muted);font-size:12px}.week div:first-child{color:var(--red)}.week div:last-child{color:var(--blue)}.day{min-height:65px;text-align:left;vertical-align:top;border:1px solid transparent;border-radius:10px;background:#fbfdfc;padding:6px 4px;color:var(--ink)}.day.other{opacity:.35}.day.selected{background:var(--soft);border-color:var(--accent)}.day.today .num{font-weight:800;text-decoration:underline;text-underline-offset:3px}.day.sun .num{color:var(--red)}.day.sat .num{color:var(--blue)}.num{font-size:13px}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}.count{font-size:9px;color:var(--muted);margin-top:2px}.tools{margin-top:12px}.notice{font-size:12px;color:var(--muted);background:#f2f7f5;padding:10px 12px;border-radius:10px;margin-top:12px}.muted{color:var(--muted);font-size:12px}.progress{height:7px;background:#edf2f0;border-radius:9px;overflow:hidden;margin:10px 0 5px}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.search{display:grid;grid-template-columns:1fr 135px;gap:7px;margin:13px 0}.search input,.search select,.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}.event{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.event.done{opacity:.55;background:#f8faf9}.event.done .evtitle{text-decoration:line-through}.check{margin:3px 0 0;accent-color:var(--accent);width:19px;height:19px}.evmain{flex:1;min-width:0}.evtitle{font-weight:700;overflow-wrap:anywhere}.evmeta{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}.tag{display:inline-block;background:var(--soft);color:var(--accent);border-radius:20px;padding:1px 6px;font-size:10px}.evactions{display:flex;gap:4px}.evactions button{border:0;border-radius:7px;background:var(--soft);color:var(--accent);padding:5px 7px;font-size:11px}.empty{text-align:center;padding:25px;color:var(--muted);font-size:13px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:650;color:#536965}.field textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalback{position:fixed;inset:0;background:#152d2a88;display:grid;place-items:center;padding:14px;z-index:20}.modal{background:white;border-radius:17px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:19px}.modal h2{margin:0 0 12px;font-size:19px}.modalfoot{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:14px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263d3a;color:white;padding:10px 16px;border-radius:30px;z-index:40;font-size:13px}.lockscreen{min-height:100vh;display:grid;place-items:center;padding:18px}.lockcard{width:min(410px,100%);text-align:center}.lockcard h1{margin:8px}.pin{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:.25em;margin:7px 0}.reflection{margin-top:14px}.reflection textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}.reportrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px}.footer{font-size:11px;color:var(--muted);margin-top:16px}
@media(max-width:740px){.layout{grid-template-columns:1fr}.shell{padding:12px 10px 30px}.panel{padding:13px}.day{min-height:56px}.top{align-items:flex-start}.brand h1{font-size:19px}.actions .btn{font-size:11px;padding:7px 8px}}
@media print{body{background:white}.shell{max-width:none;padding:0}.actions,.monthnav,.tools,.search,.evactions,.check,.footer,.btn{display:none!important}.layout{display:block}.panel{margin-bottom:12px;break-inside:avoid}.day{min-height:50px}}
</style>
</head>
<body>
<section id="lockscreen" class="lockscreen"><div class="panel lockcard"><div class="logo" style="margin:auto">🗓️</div><h1>予定ノート</h1><p id="lock-caption" class="muted">PINを設定して始めましょう。</p><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="40" placeholder="PIN（4文字以上）"><input id="pin2" class="pin" type="password" inputmode="numeric" maxlength="40" placeholder="PINをもう一度"><button id="unlock" class="btn" style="width:100%">PINを設定</button><p id="lock-error" class="muted"></p><div class="notice">予定データはAES-GCMで暗号化し、IndexedDBに保存します。PINを忘れると復元できません。バックアップを必ず保管してください。</div></div></section>
<main id="app" class="hidden"><div class="shell">
<header class="top"><div class="brand"><div class="logo">🗓️</div><div><h1>予定ノート</h1><p>毎日の予定を、すっきり整理。</p></div></div><div class="actions"><button class="btn secondary" id="backup">バックアップ</button><button class="btn secondary" id="report">月のまとめ</button><button class="btn ghost" id="settings">設定</button><button class="btn" id="add">＋ 予定を追加</button></div></header>
<div class="layout"><section class="panel" id="calendar-panel"><div class="monthhead"><h2 id="month-label"></h2><div class="monthnav"><button class="iconbtn" id="prev">‹</button><button class="iconbtn" id="today">今日</button><button class="iconbtn" id="next">›</button></div></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="calendar" id="calendar"></div><div class="tools"><button class="btn secondary small" id="hide">完了した予定を隠す</button><button class="btn secondary small" id="move">未完了の過去予定を今日へ</button></div><div class="notice">データはこのブラウザ内に暗号化して保存されます。端末変更やブラウザのデータ削除に備えて、定期的にバックアップしてください。</div></section>
<section class="panel"><div class="sect"><h2 id="selected-label">予定</h2><span class="muted" id="daily-count"></span></div><div class="progress"><span id="progress-fill" style="width:0%"></span></div><div class="muted" id="progress-label"></div><div class="search"><input id="query" placeholder="予定名・メモ・場所を検索"><select id="filter"><option value="">すべての分類</option></select></div><div id="events"></div></section></div>
<section class="panel reflection"><div class="sect"><h2>今月のふりかえり</h2><span class="muted" id="reflection-label"></span></div><textarea id="reflection" rows="3" placeholder="今月できたこと、来月がんばりたいこと…"></textarea><div style="text-align:right;margin-top:7px"><button class="btn secondary small" id="save-reflection">保存</button></div></section><p class="footer">通知はアプリを開いている間のリマインダーです。ブラウザを閉じている間の通知は保証されません。</p>
</div></main><div id="modal-root"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), CATS=['学校','勉強','習い事','部活','友達','家族','お出かけ','趣味','健康','買い物','プライベート','その他'], EMO=['📌','📚','✏️','🏫','⚽','🎵','🎨','👥','🏠','🎂','🛍️','💡','❤️','🌱','🚃','⭐'], COLORS=['#527e76','#6386ad','#b18a62','#8c79a9','#c17b83'];
const DB='yotei-note-vault', STORE='data', ID='main', ITER=260000;
let db,key=null,boxMeta=null,data=null,month=new Date(),chosen=fmt(new Date()),hideDone=false,focusBack=null,touchStart=null;
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateOf(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){let d=dateOf(s);d.setDate(d.getDate()+n);return fmt(d)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2300)}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function readBox(){return new Promise((ok,no)=>{let r=db.transaction(STORE).objectStore(STORE).get(ID);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>no(r.error)})}
function writeBox(v){return new Promise((ok,no)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,ID);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}
async function derive(pin,salt){let m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function pack(obj,pin){let salt=crypto.getRandomValues(new Uint8Array(16)),k=await derive(pin,salt);return {...await encrypt(obj,k),salt:[...salt],iterations:ITER}}
async function encrypt(obj,k){let iv=crypto.getRandomValues(new Uint8Array(12)),plain=new TextEncoder().encode(JSON.stringify(obj)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,plain);return {v:1,iv:[...iv],cipher:[...new Uint8Array(cipher)]}}
async function unpack(box,pin){let k=await derive(pin,new Uint8Array(box.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(box.iv)},k,new Uint8Array(box.cipher));return {key:k,data:JSON.parse(new TextDecoder().decode(plain))}}
function blank(){return {events:[],reflections:{},templates:[]}}
async function save(silent=false){let enc=await encrypt(data,key);await writeBox({...boxMeta,...enc});if(!silent)toast('保存しました')}
async function init(){try{if(!crypto.subtle||!indexedDB)throw Error('HTTPSのSafariまたはChromeで開いてください。');db=await openDB();let b=await readBox();if(b){$('#lock-caption').textContent='PINを入力してロックを解除してください。';$('#pin2').classList.add('hidden');$('#unlock').textContent='ロックを解除';$('#unlock').onclick=unlock}else{$('#pin2').classList.remove('hidden');$('#unlock').textContent='PINを設定';$('#unlock').onclick=setup}}catch(e){$('#lock-error').textContent=e.message}}
async function setup(){let p=$('#pin').value;if(p.length<4||p!==$('#pin2').value){$('#lock-error').textContent=p.length<4?'PINは4文字以上にしてください。':'PINが一致しません。';return}try{data=blank();let legacy=localStorage.getItem('yoteiNoteEvents');if(legacy){try{let old=JSON.parse(legacy);if(Array.isArray(old))data.events=old.map(e=>({...e,id:e.id||uid(),category:e.category||'その他',emoji:e.emoji||'📌'}))}catch{}}let b=await pack(data,p);await writeBox(b);let check=await unpack(await readBox(),p);if(!Array.isArray(check.data.events))throw Error('確認失敗');key=check.key;data=check.data;boxMeta={v:1,salt:b.salt,iterations:ITER};if(legacy)localStorage.removeItem('yoteiNoteEvents');enter();toast('暗号化して保存しました')}catch(e){$('#lock-error').textContent='保存できません：'+e.message}}
async function unlock(){try{let b=await readBox(),r=await unpack(b,$('#pin').value);key=r.key;data=r.data;boxMeta={v:1,salt:b.salt,iterations:b.iterations||ITER};enter()}catch{$('#lock-error').textContent='PINが違うか、データを読み込めません。'}}
function enter(){$('#lockscreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#filter').innerHTML='<option value="">すべての分類</option>'+CATS.map(c=>`<option>${c}</option>`).join('');render();scheduleReminders()}
function eventsAt(d){return data.events.filter(e=>e.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),prevLast=new Date(y,m,0).getDate(),today=fmt(new Date()),h='';$('#month-label').textContent=`${y}年${m+1}月`;for(let i=0;i<42;i++){let d,dt,other=false;if(i<first){d=prevLast-first+i+1;dt=new Date(y,m-1,d);other=true}else if(i>=first+last){d=i-first-last+1;dt=new Date(y,m+1,d);other=true}else{d=i-first+1;dt=new Date(y,m,d)}let s=fmt(dt),ev=eventsAt(s),cls=['day',other?'other':'',s===chosen?'selected':'',s===today?'today':'',dt.getDay()===0?'sun':'',dt.getDay()===6?'sat':''].join(' ');h+=`<button class="${cls}" data-date="${s}"><span class="num">${d}</span><div class="dots">${ev.slice(0,5).map(e=>`<i class="dot" style="background:${COLORS[Math.max(0,CATS.indexOf(e.category))%COLORS.length]}"></i>`).join('')}</div>${ev.length?`<div class="count">${ev.length}件</div>`:''}</button>`}$('#calendar').innerHTML=h;$('#calendar').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{chosen=b.dataset.date;let d=dateOf(chosen);if(d.getMonth()!==month.getMonth()||d.getFullYear()!==month.getFullYear())month=new Date(d.getFullYear(),d.getMonth(),1);render()});$('#today').classList.toggle('hidden',y===new Date().getFullYear()&&m===new Date().getMonth())}
function renderEvents(){let q=$('#query').value.trim().toLowerCase(),cat=$('#filter').value,search=!!(q||cat),daily=eventsAt(chosen),done=daily.filter(e=>e.done).length;$('#selected-label').textContent=search?'検索結果':`${chosen}の予定`;$('#daily-count').textContent=search?'':`${daily.length}件` ;$('#progress-fill').style.width=daily.length?`${done/daily.length*100}%`:'0%';$('#progress-label').textContent=daily.length?`この日の達成度：${done} / ${daily.length}件`:'予定はまだありません';let list=data.events.filter(e=>(!hideDone||!e.done)&&(!cat||e.category===cat)&&(!q||`${e.title} ${e.note||''} ${e.location||''}`.toLowerCase().includes(q)));if(!search)list=list.filter(e=>e.date===chosen);else list.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));$('#events').innerHTML=list.length?list.map(e=>`<article class="event ${e.done?'done':''}" data-id="${esc(e.id)}"><input class="check" type="checkbox" data-check="${esc(e.id)}" ${e.done?'checked':''}><div class="evmain"><div class="evtitle">${esc(e.emoji||'📌')} ${esc(e.title)}</div><div class="evmeta">${search?esc(e.date)+' ・ ':''}${esc(e.time||'時間未設定')} ・ <span class="tag">${esc(e.category||'その他')}</span>${e.location?`<br>📍 ${esc(e.location)} <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}">地図</a>`:''}${e.note?'<br>'+esc(e.note):''}</div></div><div class="evactions"><button data-edit="${esc(e.id)}">編集</button><button data-delete="${esc(e.id)}">削除</button></div></article>`).join(''):'<div class="empty">該当する予定はありません。<br>「＋ 予定を追加」から登録できます。</div>';$('#events').querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>toggle(c.dataset.check,c.checked));$('#events').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('#events').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>del(b.dataset.delete));$('#reflection-label').textContent=`${month.getFullYear()}年${month.getMonth()+1}月`;$('#reflection').value=data.reflections[monthKey()]||''}
function render(){renderCalendar();renderEvents()}
function monthKey(){return `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`}
function modal(title,body,buttons){focusBack=document.activeElement;$('#modal-root').innerHTML=`<div class="modalback" id="back"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<div class="modalfoot">${buttons}</div></div></div>`;$('#back').onclick=e=>{if(e.target.id==='back')closeModal()};$('#modal-root').querySelector('input,select,textarea,button')?.focus();document.addEventListener('keydown',modalKey)}
function closeModal(){document.removeEventListener('keydown',modalKey);$('#modal-root').innerHTML='';focusBack?.focus?.()}
function modalKey(e){if(e.key==='Escape')closeModal();if(e.key==='Tab'){let a=[...$('#modal-root').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);if(a.length&&e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(a.length&&!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}}
function form(e={}){return `<form id="form"><div class="field"><label>予定の名前 *</label><input id="title" required maxlength="80" value="${esc(e.title||'')}" placeholder="例：数学の宿題"></div><div class="grid2"><div class="field"><label>日付 *</label><input id="date" type="date" required value="${esc(e.date||chosen)}"></div><div class="field"><label>時間</label><input id="time" type="time" value="${esc(e.time||'')}"></div><div class="field"><label>分類</label><select id="cat">${CATS.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>マーク</label><select id="emoji">${EMO.map(x=>`<option ${e.emoji===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>場所</label><input id="location" maxlength="100" value="${esc(e.location||'')}"></div><div class="field"><label>メモ</label><textarea id="note" maxlength="500">${esc(e.note||'')}</textarea></div><div class="field"><label>繰り返し</label><select id="repeat"><option value="none">繰り返さない</option><option value="weekly">毎週</option><option value="biweekly">2週間ごと</option><option value="monthly">毎月</option><option value="yearly">毎年</option></select></div><div class="field"><label>通知リマインダー</label><select id="remind"><option value="0">設定しない</option><option value="5">5分前</option><option value="10">10分前</option><option value="30">30分前</option><option value="60">1時間前</option><option value="1440">1日前</option></select></div><p class="muted">繰り返しは最大24回分を作成します。</p></form>`}
function getForm(){return {title:$('#title').value.trim(),date:$('#date').value,time:$('#time').value,category:$('#cat').value,emoji:$('#emoji').value,location:$('#location').value.trim(),note:$('#note').value.trim(),remind:Number($('#remind').value)||0}}
function occurrences(start,r){if(r==='none')return [start];let out=[];for(let i=0;i<24;i++){let d=dateOf(start);if(r==='weekly')d.setDate(d.getDate()+7*i);if(r==='biweekly')d.setDate(d.getDate()+14*i);if(r==='monthly')d.setMonth(d.getMonth()+i);if(r==='yearly')d.setFullYear(d.getFullYear()+i);out.push(fmt(d))}return out}
function add(){modal('予定を追加',form(),'<button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn" id="save-event">保存する</button>');$('#save-event').onclick=()=>{if(!$('#form').reportValidity())return;let d=getForm(),r=$('#repeat').value,sid=r==='none'?null:uid();occurrences(d.date,r).forEach((date,i)=>data.events.push({...d,id:uid(),date,done:false,seriesId:sid,seriesIndex:i,repeat:r}));chosen=d.date;let dt=dateOf(chosen);month=new Date(dt.getFullYear(),dt.getMonth(),1);closeModal();save(true).then(render);toast('予定を保存しました')}}
function edit(id){let e=data.events.find(x=>x.id===id);if(!e)return;modal('予定を編集',form(e)+`<div class="field"><label>変更する範囲</label><select id="scope"><option value="one">この予定だけ</option><option value="future">この予定と、これ以降</option><option value="all">シリーズ全体</option></select></div>`,'<button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn" id="save-event">変更を保存</button>');$('#repeat').disabled=true;$('#save-event').onclick=()=>{if(!$('#form').reportValidity())return;let d=getForm(),scope=$('#scope').value,group=e.seriesId?data.events.filter(x=>x.seriesId===e.seriesId):[e],targets=scope==='all'?group:scope==='future'?group.filter(x=>x.date>=e.date):[e],delta=Math.round((dateOf(d.date)-dateOf(e.date))/86400000);targets.forEach(x=>{Object.assign(x,{title:d.title,time:d.time,category:d.category,emoji:d.emoji,location:d.location,note:d.note,remind:d.remind});x.date=scope==='one'?d.date:addDays(x.date,delta)});closeModal();save(true).then(render);toast('予定を変更しました')}}
function del(id){let e=data.events.find(x=>x.id===id);if(!e)return;modal('予定を削除',`<p>「${esc(e.title)}」を削除しますか？</p>${e.seriesId?'<div class="field"><label>削除する範囲</label><select id="scope"><option value="one">この予定だけ</option><option value="future">この予定と、これ以降</option><option value="all">シリーズ全体</option></select></div>':''}`,'<button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn danger" id="confirm">削除する</button>');$('#confirm').onclick=()=>{let scope=e.seriesId?$('#scope').value:'one',group=data.events.filter(x=>x.seriesId===e.seriesId),targets=scope==='all'?group:scope==='future'?group.filter(x=>x.date>=e.date):[e],ids=new Set(targets.map(x=>x.id));data.events=data.events.filter(x=>!ids.has(x.id));closeModal();save(true).then(render);toast('削除しました')}}
async function toggle(id,v){let e=data.events.find(x=>x.id===id);if(!e)return;e.done=v;let card=document.querySelector(`[data-id="${CSS.escape(id)}"]`);if(card){card.classList.toggle('done',v);card.querySelector('.evtitle').style.textDecoration=v?'line-through':''}await save(true);renderCalendar();let d=eventsAt(chosen),n=d.filter(x=>x.done).length;$('#daily-count').textContent=`${d.length}件` ;$('#progress-fill').style.width=d.length?`${n/d.length*100}%`:'0%';$('#progress-label').textContent=d.length?`この日の達成度：${n} / ${d.length}件`:'予定はまだありません';if(v&&d.length&&n===d.length)toast('今日の予定を全部達成！🎉')}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);let d=dateOf(chosen);chosen=fmt(new Date(month.getFullYear(),month.getMonth(),Math.min(d.getDate(),new Date(month.getFullYear(),month.getMonth()+1,0).getDate())));render()}
function moveOverdue(){let t=fmt(new Date()),list=data.events.filter(e=>e.date<t&&!e.done);if(!list.length){toast('移動する予定はありません');return}list.forEach(e=>e.date=t);chosen=t;month=new Date();save(true).then(render);toast(`${list.length}件を今日に移動しました`)}
function report(){let y=month.getFullYear(),m=month.getMonth(),a=data.events.filter(e=>{let d=dateOf(e.date);return d.getFullYear()===y&&d.getMonth()===m}),done=a.filter(e=>e.done).length;let body=`<p>${y}年${m+1}月：全${a.length}件 ／ 完了${done}件</p>`+CATS.map(c=>{let x=a.filter(e=>e.category===c),n=x.filter(e=>e.done).length;return x.length?`<div class="reportrow"><span>${c}</span><b>${n} / ${x.length}件</b></div>`:''}).join('');modal('今月のまとめ',body,'<button class="btn" onclick="closeModal()">閉じる</button>')}
function settings(){modal('設定',`<p class="muted">PINを変更すると、データを新しいPINで暗号化し直します。</p><div class="field"><label>現在のPIN</label><input id="oldpin" type="password" inputmode="numeric"></div><div class="field"><label>新しいPIN（4文字以上）</label><input id="newpin" type="password" inputmode="numeric"></div><p class="muted">通知はアプリを開いている間のリマインダーです。閉じている間の通知は保証されません。</p><button class="btn secondary small" id="allow">通知を許可する</button> <button class="btn secondary small" id="lock">今すぐロック</button>`,'<button class="btn secondary" onclick="closeModal()">閉じる</button><button class="btn" id="change">PINを変更</button>');$('#allow').onclick=async()=>{if(!('Notification'in window)){toast('通知非対応のブラウザです');return}toast((await Notification.requestPermission())==='granted'?'通知を許可しました':'通知は許可されませんでした')};$('#change').onclick=async()=>{let n=$('#newpin').value;if(n.length<4){toast('新しいPINは4文字以上');return}try{await unpack(await readBox(),$('#oldpin').value);let b=await pack(data,n);await writeBox(b);boxMeta={v:1,salt:b.salt,iterations:ITER};closeModal();toast('PINを変更しました')}catch{toast('現在のPINが違います')}};$('#lock').onclick=()=>{closeModal();key=null;data=null;$('#app').classList.add('hidden');$('#pin').value='';$('#pin2').classList.add('hidden');$('#lock-caption').textContent='PINを入力してロックを解除してください。';$('#unlock').textContent='ロックを解除';$('#unlock').onclick=unlock;$('#lockscreen').classList.remove('hidden')}}
function backup(){modal('バックアップと復元',`<p class="muted">JSONバックアップは復元しやすいよう暗号化されていません。安全な場所に保管し、他人と共有しないでください。</p><div class="field"><label>復元するJSONファイル</label><input type="file" id="backupfile" accept=".json,application/json"></div>`,'<button class="btn secondary" onclick="closeModal()">閉じる</button><button class="btn secondary" id="export">書き出す</button><button class="btn" id="import">読み込む</button>');$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`yotei-note-${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(url);toast('バックアップを書き出しました')};$('#import').onclick=async()=>{let f=$('#backupfile').files[0];if(!f){toast('ファイルを選んでください');return}try{let d=JSON.parse(await f.text());if(!Array.isArray(d.events)||!d.reflections)throw 0;if(!confirm('現在のデータを置き換えます。よろしいですか？'))return;data=d;await save(true);closeModal();render();toast('復元しました')}catch{toast('読み込めないファイルです')}}}
function scheduleReminders(){if(!('Notification'in window)||Notification.permission!=='granted')return;let now=Date.now();data.events.filter(e=>!e.done&&e.time&&e.remind>0).forEach(e=>{let d=dateOf(e.date),[h,m]=e.time.split(':').map(Number);d.setHours(h,m,0,0);let delay=d.getTime()-e.remind*60000-now;if(delay>0&&delay<2147480000)setTimeout(()=>{if(!e.done&&Notification.permission==='granted')new Notification('予定ノート：'+e.title,{body:'予定の時間が近づいています'})},delay)})}
$('#prev').onclick=()=>changeMonth(-1);$('#next').onclick=()=>changeMonth(1);$('#today').onclick=()=>{month=new Date();chosen=fmt(new Date());render()};$('#add').onclick=add;$('#hide').onclick=()=>{hideDone=!hideDone;$('#hide').textContent=hideDone?'完了した予定を表示':'完了した予定を隠す';renderEvents()};$('#move').onclick=moveOverdue;$('#report').onclick=report;$('#settings').onclick=settings;$('#backup').onclick=backup;$('#query').oninput=renderEvents;$('#filter').onchange=renderEvents;$('#save-reflection').onclick=()=>{data.reflections[monthKey()]=$('#reflection').value;save()};$('#calendar-panel').addEventListener('touchstart',e=>{if(e.touches.length===1)touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('#calendar-panel').addEventListener('touchend',e=>{if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];touchStart=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)changeMonth(dx<0?1:-1)},{passive:true});
init();
</script></div></body></html>
